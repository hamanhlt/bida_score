server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip cho js/wasm/json — main.dart.js ~1.5 MB → ~400 KB.
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml
        font/ttf
        font/otf;

    # Flutter web dùng các file tên cố định để bootstrap app/PWA. Không cache
    # các file này, nếu không browser/service worker có thể giữ UI cũ sau deploy.
    location ~* ^/(?:flutter_bootstrap\.js|flutter\.js|main\.dart\.js|flutter_service_worker\.js|manifest\.json|version\.json)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Cache assets dài hạn (canvaskit, fonts, ảnh...). Các file app entry ở
    # trên đã được tách riêng để không bị immutable nhầm.
    location ~* \.(?:wasm|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html không cache để PWA cập nhật được sau deploy.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # SPA fallback: mọi path không match file → trả index.html.
    # Flutter Navigator handle route ở client.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
