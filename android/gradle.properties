org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Tắt Kotlin incremental compile để tránh cache conflict ("Storage is already
# registered") khi build release — xảy ra với shared_preferences_android do
# build cũ bị cắt ngang để lại lock files.
kotlin.incremental=false
kotlin.daemon.useFallbackStrategy=true
